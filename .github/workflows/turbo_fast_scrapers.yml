name: ⚡ Turbo Fast Scraper (16x Parallel - LinkedIn & Indeed)

on:
  workflow_dispatch:
    inputs:
      post_time:
        description: 'Post time window'
        required: true
        default: '3week'
        type: choice
        options:
          - '3week'
          - '2week'
          - 'week'
          - 'month'
          - 'day'
          - 'any'
      max_results:
        description: 'Max jobs per role (50 recommended for ~2-3 min total run)'
        required: true
        default: '50'
        type: choice
        options:
          - '50'
          - '25'
          - '100'
          - '200'
      fetch_descriptions:
        description: 'Fetch Full Descriptions (Leave false for 5x faster LinkedIn)'
        required: true
        default: false
        type: boolean
      boards:
        description: 'Which boards to scrape'
        required: true
        default: 'both'
        type: choice
        options:
          - 'both'
          - 'linkedin'
          - 'indeed'

jobs:
  scrape:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        board: [linkedin, indeed]
        shard: ["1/8", "2/8", "3/8", "4/8", "5/8", "6/8", "7/8", "8/8"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine if board should execute
        id: check
        run: |
          SELECTED="${{ github.event.inputs.boards || 'both' }}"
          CURRENT="${{ matrix.board }}"
          if [ "$SELECTED" != "both" ] && [ "$SELECTED" != "$CURRENT" ]; then
            echo "run=false" >> $GITHUB_OUTPUT
          else
            echo "run=true" >> $GITHUB_OUTPUT
          fi

      - name: Set up Python
        if: steps.check.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        if: steps.check.outputs.run == 'true'
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install python-jobspy pandas python-dotenv openpyxl

      - name: Scrape LinkedIn Shard ${{ matrix.shard }}
        if: steps.check.outputs.run == 'true' && matrix.board == 'linkedin'
        timeout-minutes: 60
        run: |
          POST_TIME="${{ github.event.inputs.post_time || '3week' }}"
          MAX_RES="${{ github.event.inputs.max_results || '50' }}"
          DESC_FLAG="--no-descriptions"
          if [ "${{ github.event.inputs.fetch_descriptions }}" = "true" ]; then
            DESC_FLAG=""
          fi
          python linkedin/linkedin_68_roles.py --post-time "$POST_TIME" --shard "${{ matrix.shard }}" --fast --max-results "$MAX_RES" $DESC_FLAG
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          PYTHONUNBUFFERED: "1"

      - name: Scrape Indeed Shard ${{ matrix.shard }}
        if: steps.check.outputs.run == 'true' && matrix.board == 'indeed'
        timeout-minutes: 60
        run: |
          POST_TIME="${{ github.event.inputs.post_time || '3week' }}"
          MAX_RES="${{ github.event.inputs.max_results || '50' }}"
          python indeed/indeed_68_roles.py --post-time "$POST_TIME" --shard "${{ matrix.shard }}" --fast --max-results "$MAX_RES"
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          PYTHONUNBUFFERED: "1"

      - name: Upload Shard Artifact
        if: steps.check.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: turbo-jobs-${{ matrix.board }}-${{ strategy.job-index }}
          path: |
            linkedin/linkedin_jobs/*shard*
            indeed/indeed_jobs/*shard*
          if-no-files-found: ignore

  merge-and-commit:
    needs: scrape
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all job artifacts
        uses: actions/download-artifact@v4
        with:
          path: scraped_shards/

      - name: Merge all shards into master datasets
        run: |
          python3 -c "
          import json, glob, os
          import pandas as pd

          # 1. Merge LinkedIn shards
          li_files = sorted(glob.glob('scraped_shards/**/linkedin_shard_*_jobs.json', recursive=True))
          li_jobs = []
          seen_li = set()
          for f in li_files:
              try:
                  with open(f, 'r', encoding='utf-8') as fh:
                      data = json.load(fh)
                      for j in data:
                          jid = j.get('id') or (j.get('title','')+j.get('company','')+j.get('location',''))
                          if jid not in seen_li:
                              seen_li.add(jid)
                              li_jobs.append(j)
              except Exception as e:
                  print(f'Error reading {f}: {e}')
          
          if li_jobs:
              os.makedirs('linkedin/linkedin_jobs', exist_ok=True)
              with open('linkedin/linkedin_jobs/linkedin_68roles_jobs_us.json', 'w', encoding='utf-8') as fh:
                  json.dump(li_jobs, fh, indent=2, ensure_ascii=False)
              pd.DataFrame(li_jobs).to_csv('linkedin/linkedin_jobs/linkedin_68roles_jobs_us.csv', index=False)
              print(f'✅ Merged {len(li_files)} LinkedIn shards -> {len(li_jobs)} total jobs')

          # 2. Merge Indeed shards
          ind_files = sorted(glob.glob('scraped_shards/**/indeed_shard_*_jobs.json', recursive=True))
          ind_jobs = []
          seen_ind = set()
          for f in ind_files:
              try:
                  with open(f, 'r', encoding='utf-8') as fh:
                      data = json.load(fh)
                      for j in data:
                          jid = j.get('id') or (j.get('title','')+j.get('company','')+j.get('location',''))
                          if jid not in seen_ind:
                              seen_ind.add(jid)
                              ind_jobs.append(j)
              except Exception as e:
                  print(f'Error reading {f}: {e}')

          if ind_jobs:
              os.makedirs('indeed/indeed_jobs', exist_ok=True)
              with open('indeed/indeed_jobs/indeed_68roles_jobs_us.json', 'w', encoding='utf-8') as fh:
                  json.dump(ind_jobs, fh, indent=2, ensure_ascii=False)
              pd.DataFrame(ind_jobs).to_csv('indeed/indeed_jobs/indeed_68roles_jobs_us.csv', index=False)
              print(f'✅ Merged {len(ind_files)} Indeed shards -> {len(ind_jobs)} total jobs')
          "
          rm -rf scraped_shards

      - name: Commit and push combined datasets
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "⚡ Automated Turbo Scrape update (LinkedIn & Indeed 16x Parallel) 🤖"
          file_pattern: 'linkedin/linkedin_jobs/* indeed/indeed_jobs/*'
          commit_author: github-actions[bot] <github-actions[bot]@users.noreply.github.com>
